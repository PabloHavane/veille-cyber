name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "v8.30.1" # à épingler, voir plus bas
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks git
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git --no-banner --redact -v /repo

  compose:
    name: Validation compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: docker compose config
        run: docker compose --env-file .env.example config --quiet