name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e '.[test]'
      - run: pytest

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "v8.30.1" # à épingler, voir plus bas
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks git
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git --no-banner --redact -v /repo

  compose:
    name: Validation compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: docker compose config (prod)
        run: docker compose --env-file .env.example config --quiet
      - name: docker compose config (dev)
        run: docker compose -f compose.dev.yml --env-file .env.example config --quiet
      - name: build de l'image collector (prod)
        run: docker compose --env-file .env.example build collector