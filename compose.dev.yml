services:
  freshrss:
    image: freshrss/freshrss:${FRESHRSS_TAG}
    container_name: freshrss
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    ports:
      - "8088:80"

  python:
    image: python:3.15-slim
    restart: unless-stopped
    volumes:
    - .:/app
    working_dir: /app
    